name: RepoDoctor CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/rdoctor.exe dist/
          Copy-Item scripts/install.ps1 dist/
          Copy-Item scripts/uninstall.ps1 dist/
          Copy-Item README.md dist/

          if (Test-Path LICENSE) {
            Copy-Item LICENSE dist/
          }

          Compress-Archive -Path dist/* `
            -DestinationPath RepoDoctor-windows-x86_64.zip

      - name: Prepare Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/rdoctor dist/
          cp scripts/install.sh dist/
          cp scripts/uninstall.sh dist/
          cp README.md dist/

          if [ -f LICENSE ]; then
            cp LICENSE dist/
          fi

          tar -czf RepoDoctor-linux-x86_64.tar.gz -C dist .

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: RepoDoctor-windows-x86_64
          path: RepoDoctor-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoDoctor-linux-x86_64
          path: RepoDoctor-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
